openapi: 3.1.0
info:
  title: plugrelay admin API
  version: 1.0.0
  summary: The public management API of plugrelay.
  description: |
    This is the only API the bundled console uses; there are no console-only
    endpoints. Anyone can build another front end against it.

    **Authentication.** Browsers use the `pr_session` cookie set by
    `POST /auth/login` (or `POST /setup`). Scripts send
    `Authorization: Bearer <admin token>`. While the relay only listens on
    loopback and the site setting `security.local_owner_login` is on (the
    default), requests from 127.0.0.1 are treated as the local owner and
    need no login (`GET /me` reports `auth: none`).

    **CSRF.** Cookie-authenticated requests with an unsafe method must send the
    `X-CSRF-Token` header with the value of the `pr_csrf` cookie
    (double submit). Bearer-authenticated requests are exempt.

    **Money.** Every amount is an integer number of micro-units (1/1,000,000)
    of the currency named next to it, e.g. `{"micro": 197000, "currency": "CNY"}`
    is ¥0.197. Token prices are per one million tokens. There are no ratios or
    points anywhere in this API. The one exception is settings (features,
    extensions, a group's, user's or key's layer): a setting with
    `unit: money` is shown and taken in currency units of the site currency
    (`1.5` is 1 500 000 micro-units), so a form never shows micro-units.

    **Errors.** Non-2xx responses carry an `Error` body. Validation failures
    list the offending fields so a form can point at them.

    **Pagination.** Lists that can grow without bound (request logs, audit) use
    an opaque time cursor: pass `next_cursor` back as `cursor`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /api/v1
security:
  - session: []
  - bearer: []
tags:
  - name: setup
    description: First-run wizard.
  - name: auth
    description: Login, logout and the current identity.
  - name: overview
    description: Aggregated numbers, quota windows and route status.
  - name: keys
    description: Platform keys and per-client connect snippets.
  - name: users
    description: Users and groups.
  - name: upstreams
    description: Upstreams, endpoints, manifests and tests. State is live router state.
  - name: credentials
    description: Upstream credentials. Secrets are write-only.
  - name: models
    description: Public models, their routes, and presets.
  - name: pricing
    description: Token prices in real money, and price suggestions from models.dev.
  - name: public
    description: Pages anyone may open while the public pages feature is on.
  - name: logs
    description: Request log with attempts, billing and diagnostics.
  - name: features
    description: |
      What an operator switches on and off. A feature is one switch and one
      settings form over built-in modules; its console pages show while it
      is on. Extensions (external process plugins, Go plugins of a custom
      build) are switched one by one. The settings of a group, user or key
      layer live on that object.
  - name: settings
    description: Site settings, each tagged with how a change takes effect.
  - name: mcp
    description: Upstream MCP servers exposed through the relay's MCP gateway (/mcp). Secret headers are write-only.
  - name: notifications
    description: Where alerts go (email, Feishu/Lark, DingTalk, WeCom, webhook) and the log of what was sent. Channel secrets are write-only.
  - name: audit
    description: Who changed what.
  - name: search
    description: Global search.

paths:
  # ------------------------------------------------------------------ setup
  /setup/status:
    get:
      tags: [setup]
      operationId: getSetupStatus
      summary: Whether the first-run wizard still has to run
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /setup:
    post:
      tags: [setup]
      operationId: runSetup
      summary: Finish first-run setup
      description: |
        Only accepted while `needs_setup` is true. Creates the admin account,
        stores the listen choice, applies the usage answer (`team` and `sell`
        turn the local-owner rule off; `sell` also hides upstream names from
        end users and turns on the `billing` feature), and logs the caller in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Setup done; session cookies set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in; session cookies set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "202":
          description: |
            Password accepted; the account has two-step sign-in. No session
            yet: the `pr_mfa` cookie (HttpOnly, 5 minutes) binds the pending
            sign-in, finished with POST /auth/mfa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: "`captcha_required` or `captcha_failed` (after `security.login_captcha_after` failures from the address), or `password_login_disabled`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooMany" }
        "503":
          description: "`captcha_unavailable`: the captcha provider could not be asked; sign-in fails closed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/mfa:
    get:
      tags: [auth]
      operationId: getPendingMfa
      summary: The pending sign-in's second-step methods
      description: Read by the login page after a password or single sign-on step; needs the `pr_mfa` cookie.
      security: []
      responses:
        "200":
          description: Methods the user can finish with.
          content:
            application/json:
              schema:
                type: object
                required: [methods, return_to]
                properties:
                  methods: { type: array, items: { $ref: "#/components/schemas/MfaMethod" } }
                  return_to: { type: string, description: "Where single sign-on was headed." }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Finish a sign-in with the second factor
      description: |
        A TOTP code is good once (its 30-second step is spent on first use),
        a recovery code once. Five answers per pending sign-in; wrong ones
        count against the login limiter per address and per account.
        Errors: `mfa_invalid`, `mfa_expired`, `rate_limited`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorInput" }
      responses:
        "200":
          description: Signed in; session cookies set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/passkey/options:
    post:
      tags: [auth]
      operationId: passkeyOptions
      summary: WebAuthn assertion options
      description: |
        `login`: passwordless sign-in with a discoverable passkey (user
        verification required; refused while password sign-in is off).
        `mfa`: the second step of a pending sign-in (`pr_mfa` cookie).
        `reauth`: confirming it is you before a sensitive change (session).
        The challenge is single-use and expires after 5 minutes. The RP ID
        is the host of the public URL; team and sell relays without one get
        409 `public_url_missing`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, enum: [login, mfa, reauth] }
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions (binary fields base64url).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyRequestOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/passkey:
    post:
      tags: [auth]
      operationId: passkeyLogin
      summary: Sign in with a passkey alone
      description: Checks origin, RP ID hash, user presence and verification, the signature and that the signature counter grew (a counter that goes back is refused as a possible cloned authenticator).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { $ref: "#/components/schemas/PasskeyCredential" }
      responses:
        "200":
          description: Signed in; session cookies set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooMany" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out
      responses:
        "204": { description: "Session ended." }
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who is calling, with which permissions
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me/security:
    get:
      tags: [auth]
      operationId: getSecurity
      summary: The caller's sign-in methods
      responses:
        "200":
          description: Two-step sign-in state and passkeys.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityStatus" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/reauth:
    post:
      tags: [auth]
      operationId: reauth
      summary: Confirm it is you
      description: |
        Opens a 5-minute window for sensitive changes (turning off the
        authenticator app, new recovery codes, adding or deleting a passkey),
        which otherwise answer 403 `reauth_required`. Signing in opens the
        same window. Accepts the password, a TOTP or recovery code, or a
        passkey assertion (purpose `reauth`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FactorInput" }
      responses:
        "200":
          description: Confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [until]
                properties:
                  until: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooMany" }
  /me/totp/setup:
    post:
      tags: [auth]
      operationId: setupTotp
      summary: Start authenticator-app enrollment
      description: A new secret, kept (sealed) for 15 minutes until confirmed with POST /me/totp. Needs a recent sign-in or re-authentication.
      responses:
        "200":
          description: Secret and otpauth URI for the QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri, expires_at]
                properties:
                  secret: { type: string, description: "Base32, for typing in by hand." }
                  otpauth_uri: { type: string }
                  expires_at: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/totp:
    post:
      tags: [auth]
      operationId: enableTotp
      summary: Confirm authenticator-app enrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Turned on; ten new recovery codes, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [auth]
      operationId: disableTotp
      summary: Turn off the authenticator app
      description: Needs a recent re-authentication. Recovery codes go too unless a passkey remains.
      responses:
        "204": { description: "Turned off." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/recovery-codes:
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      responses:
        "200":
          description: Ten new codes; the old ones stop working.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/password:
    post:
      tags: [auth]
      operationId: changeOwnPassword
      summary: Set the caller's own password
      description: Needs a recent re-authentication (403 `reauth_required`), which asks for the current password when the account has one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 10 }
      responses:
        "204": { description: Changed. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /me/passkeys/options:
    post:
      tags: [auth]
      operationId: passkeyRegisterOptions
      summary: WebAuthn creation options for a new passkey
      description: Attestation `none`, ES256/EdDSA/RS256, resident key and user verification preferred; existing passkeys are excluded.
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions (binary fields base64url).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCreationOptions" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/passkeys:
    post:
      tags: [auth]
      operationId: registerPasskey
      summary: Register a passkey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                name: { type: string, maxLength: 64 }
                credential: { $ref: "#/components/schemas/PasskeyCredential" }
      responses:
        "201":
          description: Registered. The first factor of an account also brings recovery codes, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [passkey]
                properties:
                  passkey: { $ref: "#/components/schemas/Passkey" }
                  recovery_codes: { type: array, items: { type: string } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /me/passkeys/{id}:
    patch:
      tags: [auth]
      operationId: renamePasskey
      summary: Rename a passkey
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "204": { description: "Renamed." }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [auth]
      operationId: deletePasskey
      summary: Delete a passkey
      description: Needs a recent re-authentication.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: "Deleted." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /auth/providers:
    get:
      tags: [auth]
      operationId: listAuthProviders
      summary: Sign-in methods the login page offers
      security: []
      responses:
        "200":
          description: Enabled single sign-on providers and whether password sign-in is on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthProviders" }
  /auth/sso/{id}/start:
    get:
      tags: [auth]
      operationId: startSso
      summary: Begin single sign-on (browser navigation)
      description: |
        Redirects to the identity provider with PKCE, state and nonce. The
        pending sign-in is bound to the browser by the `pr_sso` cookie and
        expires after 10 minutes. Errors redirect to `/login?sso_error=<code>`.
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: return_to, in: query, description: "Site-relative path to land on; anything else becomes /.", schema: { type: string } }
      responses:
        "302": { description: "To the identity provider, or back to the login page with sso_error." }
  /auth/sso/{id}/callback:
    get:
      tags: [auth]
      operationId: ssoCallback
      summary: Identity provider redirect target
      description: |
        Checks state (one-time, bound to the `pr_sso` cookie), redeems the
        code, verifies the ID token (signature via JWKS, issuer, audience,
        expiry, nonce) or reads the OAuth user profile, maps the identity to a
        user and sets the same session cookies as password login. Redirects to
        `return_to`, or to `/login?sso_error=<code>` with one of
        state_mismatch, state_expired, state_replayed, denied, invalid_token,
        provider_error, domain_not_allowed, tenant_not_allowed,
        email_unverified, account_exists, no_account, account_disabled,
        unknown_provider, public_url_missing, rate_limited.
      security: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Signed in (session cookies set) or refused.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SessionCookie" }

  # ------------------------------------------------------------------ overview
  /overview:
    get:
      tags: [overview]
      operationId: getOverview
      summary: Headline numbers for one time range
      description: Read from pre-aggregated tables. Admins see the whole relay unless `key_id` or `user_id` narrows it; end users always see their own.
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: key_id, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Overview stats.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
  /usage/timeseries:
    get:
      tags: [overview]
      operationId: getUsageTimeseries
      summary: Get usage timeseries
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: metric
          in: query
          schema: { type: string, enum: [spend, requests, tokens, cache_hit_rate], default: spend }
        - name: group_by
          in: query
          schema: { type: string, enum: [none, model, key, upstream, user, client], default: model }
        - name: bucket
          in: query
          description: "hour = hourly buckets whatever the range (the weekday × hour heatmap); default depends on the range."
          schema: { type: string, enum: [hour] }
        - { name: key_id, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Bucketed series. With group_by=client the label of client `other` is empty.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timeseries" }
  /usage/top:
    get:
      tags: [overview]
      operationId: getUsageTop
      summary: Models, keys, users or clients ranked by spend
      description: End users only see their own usage. Spend, tokens and cache hit come from the hourly roll-ups; the p95 first-token time from the successful requests in the log.
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: by
          in: query
          required: true
          schema: { type: string, enum: [model, key, user, client] }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: key_id, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Rows, most spend first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageTop" }
  /usage/failures:
    get:
      tags: [overview]
      operationId: getUsageFailures
      summary: Failed requests over time by final cause
      description: "Buckets as /usage/timeseries. Causes are the attempt causes plus not_sent (refused before any upstream was tried); series are ordered by their total, every bucket present."
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - { name: key_id, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: One series per cause.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsageFailures" }
  /clients:
    get:
      tags: [logs]
      operationId: listClients
      summary: Client programs the relay recognises in requests
      responses:
        "200":
          description: Every known client in detection order, then other (empty name). A key's allowed clients are any of these ids but other.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string }
                        name: { type: string }
  /quota:
    get:
      tags: [overview]
      operationId: getQuota
      summary: Quota windows that apply to the caller (or to one key)
      parameters:
        - { name: key_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Windows side by side.
          content:
            application/json:
              schema:
                type: object
                required: [windows]
                properties:
                  windows:
                    type: array
                    items: { $ref: "#/components/schemas/QuotaWindow" }
  /status:
    get:
      tags: [overview]
      operationId: getStatus
      summary: Route status per model, as end users see it
      responses:
        "200":
          description: Per-model status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPage" }
  /public/catalog:
    get:
      tags: [public]
      operationId: getPublicCatalog
      summary: Public models-and-prices page
      description: No sign-in. 404 `public_pages_off` while the public pages feature is off; answers are reused for a minute; loads are limited per address (429).
      security: []
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCatalog" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
  /public/status:
    get:
      tags: [public]
      operationId: getPublicStatus
      summary: Public status page
      description: No sign-in. 404 `public_pages_off` while the feature or its status page is off; cached and limited like the catalog.
      security: []
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStatus" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooMany" }
  /catalog:
    get:
      tags: [pricing]
      operationId: getCatalog
      summary: Models the caller may use, with effective prices
      responses:
        "200":
          description: Catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogEntry" }

  # ------------------------------------------------------------------ keys
  /keys:
    get:
      tags: [keys]
      operationId: listKeys
      summary: List keys
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/KeyStatus" } }
      responses:
        "200":
          description: Keys visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Key" }
    post:
      tags: [keys]
      operationId: createKey
      summary: Create key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyInput" }
      responses:
        "201":
          description: Created. `secret` is shown this one time only; the relay keeps a hash.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
        "422": { $ref: "#/components/responses/Invalid" }
  /keys/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [keys]
      operationId: getKey
      summary: Get key
      responses:
        "200":
          description: One key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Key" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [keys]
      operationId: updateKey
      summary: Update key
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KeyPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Key" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [keys]
      operationId: deleteKey
      summary: Delete key
      responses:
        "204": { description: "Revoked and deleted." }
        "404": { $ref: "#/components/responses/NotFound" }
  /keys/{id}/rotate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [keys]
      operationId: rotateKey
      summary: Issue a new secret; the old one stops working at once
      responses:
        "200":
          description: New secret, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KeyCreated" }
  /keys/{id}/connect:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [keys]
      operationId: getKeyConnect
      summary: Per-client configuration for this key
      description: |
        The relay stores only a hash of the key, so snippets and the
        `ccswitch://` link contain the literal placeholder `{{api_key}}`.
        A client that holds the secret (right after creation) substitutes it;
        otherwise it shows the placeholder and the user pastes their key.
      parameters:
        - name: os
          in: query
          schema: { $ref: "#/components/schemas/ClientOS" }
      responses:
        "200":
          description: Snippets per client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectInfo" }
  /keys/{id}/settings:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [features]
      operationId: getKeySettings
      summary: The key's settings layer
      description: Every setting of a core module, of a feature that is on, or of a running extension that may be placed on this layer, with its merged value. Settings that are fields of the key itself (a key's rpm, concurrency and budgets, a group's body logging) are not listed.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [features]
      operationId: putKeySettings
      summary: Change settings on the key's layer
      description: Only the settings named change; `null` removes one (a secret sent as `null` keeps its value).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { $ref: "#/components/schemas/SettingValues" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /keys/{id}/test:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [keys]
      operationId: testKey
      summary: Send a tiny request through the relay with this key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client: { $ref: "#/components/schemas/ClientId" }
                model: { type: string }
      responses:
        "200":
          description: One result (also 200 when the test request failed; see `ok`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestOutcome" }
  /playground:
    post:
      tags: [keys]
      operationId: playground
      summary: Talk to a model through the relay
      description: >-
        Sends the conversation as a real client request (logged, metered and billed like any other; the log shows it
        as the playground) in the chosen client protocol, with one of the caller's keys. Admins may leave `key_id` out to talk as
        themselves. The answer is a server-sent event stream: `start` (`request_id`), `text` and `reasoning` (`text`), then
        one `done` (`ok`, `status`, `ttfb_ms`, `latency_ms`, `usage`, `error`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaygroundRequest" }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }

  # ------------------------------------------------------------------ users & groups
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: group_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      tags: [users]
      operationId: createUser
      summary: Create user
      description: Creating an admin needs a recent re-authentication of the calling session (403 `reauth_required`; see POST /me/reauth).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
  /users/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [users]
      operationId: getUser
      summary: Get user
      responses:
        "200":
          description: One user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update user
      description: Changing `password` or `role`, disabling the user, or re-enabling a disabled admin needs a recent re-authentication of the calling session (403 `reauth_required`; see POST /me/reauth). The login name (`username`, usually the email) cannot be changed; an `email` that differs from it is refused with 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatch" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete user
      description: >-
        Needs a recent re-authentication of the calling session (403 `reauth_required`; see POST /me/reauth).
        Plugins first end what the user has running (a subscription a payment provider bills); when one cannot,
        the deletion is refused with 409 `user_delete_blocked` naming the reason, and `force=true` deletes anyway
        (the provider may keep billing; audited with `force`).
      parameters:
        - { name: force, in: query, required: false, schema: { type: boolean }, description: "Delete even when a plugin could not end what the user has running." }
      responses:
        "204": { description: "Deleted; the user's keys are revoked." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /users/{id}/settings:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [features]
      operationId: getUserSettings
      summary: The user's settings layer
      description: Every setting of a core module, of a feature that is on, or of a running extension that may be placed on this layer, with its merged value. Settings that are fields of the user itself (a key's rpm, concurrency and budgets, a group's body logging) are not listed.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [features]
      operationId: putUserSettings
      summary: Change settings on the user's layer
      description: Only the settings named change; `null` removes one (a secret sent as `null` keeps its value).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { $ref: "#/components/schemas/SettingValues" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
  /users/{id}/identities:
    get:
      tags: [users]
      operationId: listUserIdentities
      summary: Single sign-on identities linked to a user
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Linked identities.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Identity" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/identities/{identity_id}:
    delete:
      tags: [users]
      operationId: deleteUserIdentity
      summary: Unlink a single sign-on identity
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: identity_id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: "Unlinked." }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/mfa:
    delete:
      tags: [users]
      operationId: resetUserMfa
      summary: Remove a user's two-step sign-in
      description: Deletes the user's authenticator app, recovery codes and passkeys (audited as `user.mfa_reset`). Needs a recent re-authentication of the calling session (403 `reauth_required`). The CLI equivalent is `plugrelay user reset-2fa`.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: "Removed." }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /groups:
    get:
      tags: [users]
      operationId: listGroups
      summary: List groups
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Group" } }
    post:
      tags: [users]
      operationId: createGroup
      summary: Create group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "422": { $ref: "#/components/responses/Invalid" }
  /groups/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [users]
      operationId: updateGroup
      summary: Update group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroupInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [users]
      operationId: deleteGroup
      summary: Delete group
      responses:
        "204": { description: "Deleted." }
        "409": { $ref: "#/components/responses/Conflict" }
  /groups/{id}/settings:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [features]
      operationId: getGroupSettings
      summary: The group's settings layer
      description: Every setting of a core module, of a feature that is on, or of a running extension that may be placed on this layer, with its merged value. Settings that are fields of the group itself (a group's rpm, concurrency and budgets, a group's body logging) are not listed.
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [features]
      operationId: putGroupSettings
      summary: Change settings on the group's layer
      description: Only the settings named change; `null` removes one (a secret sent as `null` keeps its value).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { $ref: "#/components/schemas/SettingValues" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LayerSettings" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }

  # ------------------------------------------------------------------ upstreams
  /upstreams:
    get:
      tags: [upstreams]
      operationId: listUpstreams
      summary: Upstreams with live router state
      description: "`state` and each credential's `state` are read from the router at request time, never from a stored copy."
      parameters:
        - { name: q, in: query, schema: { type: string } }
      responses:
        "200":
          description: Upstreams.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Upstream" } }
    post:
      tags: [upstreams]
      operationId: createUpstream
      summary: Create upstream
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upstream" }
        "422": { $ref: "#/components/responses/Invalid" }
  /upstreams/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [upstreams]
      operationId: getUpstream
      summary: Get upstream
      responses:
        "200":
          description: One upstream.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upstream" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [upstreams]
      operationId: updateUpstream
      summary: Update upstream
      description: Fields set here override the manifest on this site only; later manifest updates still apply to fields not overridden.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpstreamInput" }
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Upstream" }
        "422": { $ref: "#/components/responses/Invalid" }
    delete:
      tags: [upstreams]
      operationId: deleteUpstream
      summary: Delete upstream
      responses:
        "204": { description: "Deleted." }
        "409": { $ref: "#/components/responses/Conflict" }
  /upstreams/{id}/test:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [upstreams]
      operationId: testUpstream
      summary: Test upstream
      description: "Tests the stored configuration, including changes made just before. Without `model`, it uses a model routed to the upstream, else the first chat model the upstream lists."
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestRequest" }
      responses:
        "200":
          description: One result per credential tested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestOutcome" }
  /upstreams/{id}/remote-models:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [upstreams]
      operationId: listRemoteModels
      summary: Ask the upstream which models it serves
      responses:
        "200":
          description: Remote model list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ModelInfo" } }
        "502": { $ref: "#/components/responses/UpstreamFailed" }
  /manifests:
    get:
      tags: [upstreams]
      operationId: listManifests
      summary: Official and local upstream manifests available to create from
      responses:
        "200":
          description: Manifests.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Manifest" } }

