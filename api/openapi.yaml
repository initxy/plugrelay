      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "422": { $ref: "#/components/responses/Invalid" }
  /credentials/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [credentials]
      operationId: getCredential
      summary: Get credential
      responses:
        "200":
          description: One credential.
