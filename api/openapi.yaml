      responses:
        "204": { description: "Deleted." }
  /credentials/{id}/reset:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [credentials]
      operationId: resetCredential
      summary: Clear cooldown or quarantine and put the credential back in rotation
      responses:
        "200":
          description: New live state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }

  # ------------------------------------------------------------------ models & routes
  /models:
