# Checked 2026-11 against the vendor's docs:
#   https://docs.novita.ai/guides/llm-api
#   https://docs.novita.ai/guides/llm-anthropic-compatibility
#   https://docs.novita.ai/api-reference/basic-error-code
#   https://novita.ai/docs/api-reference/model-apis-llm-create-embeddings.md
#   https://novita.ai/docs/api-reference/model-apis-llm-create-rerank.md
id: novita
kind: provider
name: Novita AI
category: inference
homepage: https://docs.novita.ai
auth:
  header: Authorization
  scheme: Bearer
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://api.novita.ai/openai/v1
    interpreter: openai-compatible
    capabilities:
      cache: implicit
      freeform_tools: false
      max_tokens_field: max_tokens
      reasoning: reasoning_content
  # Suffix is not a documented parameter.
  - id: completions
    protocol: openai-completions
    base_url: https://api.novita.ai/openai/v1
    interpreter: openai-compatible
  - protocol: anthropic
    base_url: https://api.novita.ai/anthropic
    interpreter: anthropic-compatible
    capabilities:
      cache: none
      cache_1h: false
      server_tools: []
      deferred_tools: false
  - id: embeddings
    protocol: openai-embeddings
    interpreter: openai-compatible
    base_url: https://api.novita.ai/openai/v1
  # POST /openai/v1/rerank; return_documents is not documented.
  - protocol: rerank
    interpreter: openai-compatible
    base_url: https://api.novita.ai/openai/v1
errors:
  # Out of balance arrives as 403, which would otherwise quarantine the key.
  - when: {code: NOT_ENOUGH_BALANCE}
    verdict: {cause: quota, credential: cool_until_reset, retry: next, signal: quota_exhausted}
models:
  list: /models
