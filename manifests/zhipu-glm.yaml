# Checked 2026-11 against the vendor's docs:
#   https://docs.bigmodel.cn/cn/api/api-code
#   https://docs.bigmodel.cn/cn/guide/develop/claude/introduction
#   https://docs.bigmodel.cn/cn/guide/capabilities/cache
#   https://docs.z.ai/api-reference/introduction
#   https://docs.bigmodel.cn/api-reference/模型-api/文本嵌入.md
#   https://docs.bigmodel.cn/api-reference/模型-api/图像生成.md
#   https://docs.bigmodel.cn/api-reference/模型-api/语音转文本.md
#   https://docs.bigmodel.cn/api-reference/模型-api/文本重排序
# The GLM Coding Plan has its own manifest, zhipu-glm-coding.
id: zhipu-glm
kind: provider
name: Zhipu AI (GLM)
name_zh: "智谱 GLM"
category: vendor
homepage: https://docs.bigmodel.cn
variables:
  host:
    default: open.bigmodel.cn
    description: API host; api.z.ai for the international platform.
    description_zh: "API 域名；国际站填 api.z.ai。"
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://{host}/api/paas/v4
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      max_tokens_field: max_tokens
      reasoning: reasoning_content
  - protocol: anthropic
    base_url: https://{host}/api/anthropic
    interpreter: anthropic-compatible
    capabilities:
      cache_1h: false
      server_tools: []
      deferred_tools: false
  - id: embeddings
    protocol: openai-embeddings
    base_url: https://{host}/api/paas/v4
    interpreter: openai-compatible
  # Generations only, answered with data[].url (no b64_json).
  - id: images
    protocol: openai-images
    base_url: https://{host}/api/paas/v4
    interpreter: openai-compatible
    capabilities:
      image_edit: false
  # Transcriptions (glm-asr). /audio/speech exists but only outputs wav or
  # pcm with its own voices, so speech is not declared.
  - id: audio
    protocol: openai-audio
    base_url: https://{host}/api/paas/v4
    interpreter: openai-compatible
    capabilities:
      speech: false
  # Documented for open.bigmodel.cn.
  - protocol: rerank
    base_url: https://{host}/api/paas/v4
    interpreter: openai-compatible
errors:
  # Business codes in error.code: 1113 is arrears or no balance (HTTP 429).
  - when: {code: "1113"}
    verdict: {cause: quota, credential: cool_until_reset, retry: next, signal: quota_exhausted}
  - when: {code: "1261"}
    verdict: {cause: request, signal: context_too_long}
  - when: {code: "1301"}
    verdict: {cause: content, signal: content_filtered}
