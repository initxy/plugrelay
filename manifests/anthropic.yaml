# Checked 2026-11 against the vendor's docs:
#   https://platform.claude.com/docs/en/api/overview
#   https://platform.claude.com/docs/en/api/messages/batches/create
# The docs lead with Authorization: Bearer; x-api-key is accepted too.
id: anthropic
kind: provider
name: Anthropic
category: vendor
homepage: https://docs.claude.com/en/api/overview
interpreter: anthropic
auth:
  header: x-api-key
  scheme: raw
owned_headers: [Authorization]
capabilities:
  cache: explicit
  cache_1h: true
endpoints:
  - id: messages
    protocol: anthropic
    base_url: https://api.anthropic.com
    issuer: anthropic
    capabilities:
      batches: true
models:
  list: /v1/models
# First-party list prices, USD per million tokens, from
# https://platform.claude.com/docs/en/about-claude/pricing as read on
# 2026-11-08. Claude Haiku 5.5 is priced for prompts up to 100K tokens
# (longer prompts cost more).
pricing:
  currency: USD
  models:
    claude-fable-5-1:  {input: 10, cache_write_5m: 12.5, cache_write_1h: 20, cache_read: 0.25, output: 50}
    claude-fable-5:    {input: 10, cache_write_5m: 12.5, cache_write_1h: 20, cache_read: 1, output: 50}
    claude-opus-5-5:   {input: 4, cache_write_5m: 5, cache_write_1h: 8, cache_read: 0.2, output: 20}
    claude-opus-5:     {input: 5, cache_write_5m: 6.25, cache_write_1h: 10, cache_read: 0.5, output: 25}
    claude-opus-4-8:   {input: 5, cache_write_5m: 6.25, cache_write_1h: 10, cache_read: 0.5, output: 25}
    claude-opus-4-7:   {input: 5, cache_write_5m: 6.25, cache_write_1h: 10, cache_read: 0.5, output: 25}
    claude-opus-4-6:   {input: 5, cache_write_5m: 6.25, cache_write_1h: 10, cache_read: 0.5, output: 25}
    claude-sonnet-5-5: {input: 2, cache_write_5m: 2.5, cache_write_1h: 4, cache_read: 0.1, output: 10}
    claude-sonnet-5:   {input: 2, cache_write_5m: 2.5, cache_write_1h: 4, cache_read: 0.2, output: 10}
    claude-sonnet-4-6: {input: 3, cache_write_5m: 3.75, cache_write_1h: 6, cache_read: 0.3, output: 15}
    claude-haiku-5-5:  {input: 0.1, cache_write_5m: 0.125, cache_write_1h: 0.2, cache_read: 0.01, output: 0.5}
    claude-haiku-4-5:  {input: 1, cache_write_5m: 1.25, cache_write_1h: 2, cache_read: 0.1, output: 5}
