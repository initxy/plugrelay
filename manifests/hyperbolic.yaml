# Checked 2026-11 against the vendor's docs:
#   https://hyperbolic.ai/docs/inference/quickstart
#   https://hyperbolic.ai/docs/inference/errors
id: hyperbolic
kind: provider
name: Hyperbolic
category: inference
homepage: https://hyperbolic.ai/docs
interpreter: openai-compatible
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
  max_tokens_field: max_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://api.hyperbolic.ai/inference/v1
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
models:
  list: /models
