# Checked 2026-11 against the vendor's docs:
#   https://support.huaweicloud.com/model-call-maas/model-call-021.html
#   https://support.huaweicloud.com/model-call-maas/model-call-035.html
# max_tokens limits the answer only; max_completion_tokens includes
# reasoning. Sending both is an error.
id: huawei-maas
kind: provider
name: Huawei Cloud ModelArts Studio (MaaS)
name_zh: "华为云 ModelArts MaaS"
category: cloud
homepage: https://support.huaweicloud.com/model-call-maas/
interpreter: openai-compatible
variables:
  host:
    default: api.modelarts-maas.com
    description: API host; api-ap-southeast-1.modelarts-maas.com for the international site.
    description_zh: "API 域名；国际站填 api-ap-southeast-1.modelarts-maas.com。"
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://{host}/openai/v1
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
errors:
  # A frozen (overdue) resource answers 403, which would otherwise
  # quarantine the key.
  - when: {code: ModelArts.81006}
    verdict: {cause: quota, credential: cool_until_reset, retry: next, signal: quota_exhausted}
  - when: {code: ModelArts.81011}
    verdict: {cause: content, signal: content_filtered}
