# Checked 2026-11 against the vendor's docs:
#   https://github.com/dphnAI/sonar
#   https://sonar.dphn.ai/serving/openai/
#   https://github.com/dphnAI/sonar/blob/main/aphrodite/entrypoints/pooling/scoring/api_router.py
# A vLLM fork, renamed Sonar; the CLI is still aphrodite serve.
id: aphrodite
kind: provider
name: Aphrodite Engine (Sonar)
name_zh: "Aphrodite Engine（Sonar）"
category: self_hosted
homepage: https://github.com/dphnAI/sonar
interpreter: openai-compatible
variables:
  server_url:
    default: http://localhost:2242
    description: Root URL of the server, without /v1.
    description_zh: "服务的根地址，不带 /v1。"
# Runs without a key unless started with --api-key (Authorization: Bearer
# only); an empty credential secret sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
  max_tokens_field: max_completion_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
  - id: responses
    protocol: openai-responses
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - id: completions
    protocol: openai-completions
    base_url: "{server_url}/v1"
  - protocol: anthropic
    base_url: "{server_url}"
    interpreter: anthropic-compatible
    capabilities:
      cache: implicit
      cache_1h: false
      server_tools: []
      deferred_tools: false
  - id: embeddings
    protocol: openai-embeddings
    base_url: "{server_url}/v1"
  # Transcriptions and translations; no speech.
  - id: audio
    protocol: openai-audio
    base_url: "{server_url}/v1"
    capabilities:
      speech: false
  # Jina-shaped /rerank at the root (/v1/rerank is a deprecated alias),
  # registered only when a pooling (scoring) model is loaded.
  - protocol: rerank
    base_url: "{server_url}"
models:
  list: /models
