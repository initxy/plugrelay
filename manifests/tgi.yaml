# Checked 2026-11 against the vendor's docs:
#   https://huggingface.co/docs/text-generation-inference/messages_api
# TGI is in maintenance mode upstream; only its Messages API (chat
# completions) is OpenAI-compatible.
id: tgi
kind: provider
name: Hugging Face Text Generation Inference
name_zh: "Hugging Face 文本生成推理（TGI）"
category: self_hosted
homepage: https://huggingface.co/docs/text-generation-inference
interpreter: openai-compatible
variables:
  base_url:
    default: http://localhost:3000/v1
    description: OpenAI-compatible base URL of the server, including /v1.
    description_zh: "服务的 OpenAI 兼容地址，带 /v1。"
# Self-hosted servers often run without a key; an empty credential secret
# sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{base_url}"
    capabilities:
      freeform_tools: false
