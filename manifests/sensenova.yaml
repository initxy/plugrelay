# Checked 2026-11 against the vendor's docs:
#   https://platform.sensenova.cn/docs
id: sensenova
kind: provider
name: SenseTime SenseNova
name_zh: "商汤日日新"
category: vendor
homepage: https://platform.sensenova.cn/docs
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://token.sensenova.cn/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
  - id: responses
    protocol: openai-responses
    base_url: https://token.sensenova.cn/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - protocol: anthropic
    base_url: https://token.sensenova.cn
    interpreter: anthropic-compatible
    capabilities:
      cache_1h: false
      server_tools: []
      deferred_tools: false
models:
  list: /models
