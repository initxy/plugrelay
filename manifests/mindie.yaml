# Checked 2026-11 against the vendor's docs:
#   https://raw.gitcode.com/Ascend/MindIE-Motor/raw/master/docs/zh/user_guide/api/service_interfaces.md
#   https://raw.gitcode.com/Ascend/MindIE-Motor/raw/master/docs/zh/user_guide/communication_matrix_motor.md
#   https://raw.gitcode.com/Ascend/MindIE-Motor/raw/master/docs/zh/user_guide/quick_start.md
# MindIE Motor (formerly MindIE Service) coordinates vLLM-Ascend engines on
# Ascend NPUs and forwards requests to them; the Anthropic route needs the
# vLLM backend. A plain vLLM-Ascend server is the vllm manifest.
id: mindie
kind: provider
name: Huawei MindIE
name_zh: "华为 MindIE"
category: self_hosted
homepage: https://gitcode.com/Ascend/MindIE-Motor
interpreter: openai-compatible
variables:
  server_url:
    default: http://localhost:1025
    description: Root URL of the server, without /v1.
    description_zh: "服务的根地址，不带 /v1。"
# The optional API key (api_key_config) defaults to Authorization: Bearer;
# an empty credential secret sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
  max_tokens_field: max_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
  # Create only, passed through to the engine.
  - id: responses
    protocol: openai-responses
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - id: completions
    protocol: openai-completions
    base_url: "{server_url}/v1"
  - protocol: anthropic
    base_url: "{server_url}"
    interpreter: anthropic-compatible
    capabilities:
      cache: implicit
      cache_1h: false
      server_tools: []
      deferred_tools: false
models:
  list: /models
