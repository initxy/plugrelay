# Checked 2026-11 against the vendor's docs:
#   https://docs.z.ai/api-reference/introduction.md
#   https://docs.z.ai/api-reference/llm/chat-completion.md
#   https://docs.z.ai/api-reference/image/generate-image.md
#   https://docs.z.ai/api-reference/audio/audio-transcriptions.md
#   https://docs.z.ai/api-reference/api-code.md
#   https://docs.z.ai/devpack/tool/others
# Zhipu's international platform with its own keys. The China platform is
# zhipu-glm; the GLM Coding Plan (/api/coding/paas/v4) is zhipu-glm-coding
# with host api.z.ai.
id: zai
kind: provider
name: Z.ai (GLM, international)
name_zh: "Z.ai（智谱国际版）"
category: vendor
homepage: https://docs.z.ai
interpreter: openai-compatible
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://api.z.ai/api/paas/v4
    capabilities:
      freeform_tools: false
      max_tokens_field: max_tokens
      reasoning: reasoning_content
  # Documented in the Coding Plan's endpoint table.
  - protocol: anthropic
    base_url: https://api.z.ai/api/anthropic
    interpreter: anthropic-compatible
    capabilities:
      cache_1h: false
      server_tools: []
      deferred_tools: false
  # glm-image; generations only, answered with data[].url.
  - id: images
    protocol: openai-images
    base_url: https://api.z.ai/api/paas/v4
    capabilities:
      image_edit: false
  # Transcriptions only (glm-asr).
  - id: audio
    protocol: openai-audio
    base_url: https://api.z.ai/api/paas/v4
    capabilities:
      speech: false
errors:
  # Business codes in error.code: 1113 is no balance (HTTP 429).
  - when: {code: "1113"}
    verdict: {cause: quota, credential: cool_until_reset, retry: next, signal: quota_exhausted}
  - when: {code: "1261"}
    verdict: {cause: request, signal: context_too_long}
  - when: {code: "1301"}
    verdict: {cause: content, signal: content_filtered}
