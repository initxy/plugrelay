# Checked 2026-11 against the vendor's docs:
#   https://creator.poe.com/docs/external-applications/openai-compatible-api
#   https://creator.poe.com/api-reference/errors
#   https://creator.poe.com/docs/external-applications/claude-code
# The Anthropic route serves Claude bots only. Chat ignores a top-level
# reasoning_effort.
id: poe
kind: provider
name: Poe
category: gateway
homepage: https://creator.poe.com/docs
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://api.poe.com/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      max_tokens_field: max_tokens
  - id: responses
    protocol: openai-responses
    base_url: https://api.poe.com/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - protocol: anthropic
    base_url: https://api.poe.com
    interpreter: anthropic-compatible
    capabilities:
      cache_1h: false
      server_tools: []
      deferred_tools: false
