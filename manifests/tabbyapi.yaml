# Checked 2026-11 against the vendor's docs:
#   https://github.com/theroyallab/tabbyAPI
#   https://github.com/theroyallab/tabbyAPI/blob/main/config_sample.yml
# ExLlamaV2/V3 server. /v1/embeddings needs an embedding model loaded.
id: tabbyapi
kind: provider
name: TabbyAPI
category: self_hosted
homepage: https://github.com/theroyallab/tabbyAPI
interpreter: openai-compatible
variables:
  base_url:
    default: http://localhost:5000/v1
    description: OpenAI-compatible base URL of the server, including /v1.
    description_zh: "服务的 OpenAI 兼容地址，带 /v1。"
# Auth is on by default: the key is generated into api_tokens.yml and
# accepted as Authorization: Bearer or x-api-key.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
  max_tokens_field: max_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{base_url}"
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
  - id: completions
    protocol: openai-completions
    base_url: "{base_url}"
  - id: embeddings
    protocol: openai-embeddings
    base_url: "{base_url}"
models:
  list: /models
