# Checked 2026-11 against the vendor's docs:
#   https://github.com/triton-inference-server/server/blob/main/python/openai/README.md
# Backends are vLLM or TensorRT-LLM; /v1/embeddings needs the vLLM backend.
id: triton-openai
kind: provider
name: NVIDIA Triton Inference Server (OpenAI frontend)
name_zh: "NVIDIA Triton 推理服务（OpenAI 前端）"
category: self_hosted
homepage: https://github.com/triton-inference-server/server/tree/main/python/openai
interpreter: openai-compatible
variables:
  base_url:
    default: http://localhost:9000/v1
    description: OpenAI-compatible base URL of the server, including /v1.
    description_zh: "服务的 OpenAI 兼容地址，带 /v1。"
# No API key: --openai-restricted-api can demand a fixed header, which
# fits only when set to authorization "Bearer <key>". An empty credential
# secret sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
  max_tokens_field: max_completion_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{base_url}"
    capabilities:
      freeform_tools: false
  - id: completions
    protocol: openai-completions
    base_url: "{base_url}"
  - id: embeddings
    protocol: openai-embeddings
    base_url: "{base_url}"
models:
  list: /models
