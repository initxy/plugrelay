# Checked 2026-11 against the vendor's docs:
#   https://mimo.mi.com/static/docs/api/chat/openai-api-post.md
#   https://mimo.mi.com/static/docs/api/chat/responses-post.md
#   https://mimo.mi.com/static/docs/api/guidance/error-codes.md
#   https://mimo.mi.com/static/docs/tokenplan/Token%20Plan/quick-access.md
id: xiaomi-mimo
kind: provider
name: Xiaomi MiMo
name_zh: "小米 MiMo"
category: vendor
homepage: https://mimo.mi.com
variables:
  host:
    default: api.xiaomimimo.com
    description: API host; token-plan-cn, token-plan-sgp or token-plan-ams.xiaomimimo.com for Token Plan keys.
    description_zh: "API 域名；Token Plan 的 key 填 token-plan-cn、token-plan-sgp 或 token-plan-ams.xiaomimimo.com。"
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://{host}/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
  # No background or previous_response_id.
  - id: responses
    protocol: openai-responses
    base_url: https://{host}/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - protocol: anthropic
    base_url: https://{host}/anthropic
    interpreter: anthropic-compatible
    capabilities:
      cache_1h: false
      server_tools: []
      deferred_tools: false
errors:
  - when: {status: 421}
    verdict: {cause: content, signal: content_filtered}
models:
  list: /models
