# Checked 2026-11 against the vendor's docs:
#   https://docs.vllm.ai/en/latest/serving/online_serving/openai_compatible_server/
#   https://docs.vllm.ai/en/latest/serving/online_serving/
#   https://docs.vllm.ai/en/latest/models/pooling_models/scoring/
#     (/rerank, /v1/rerank and /v2/rerank take one Jina-style body)
id: vllm
kind: provider
name: vLLM
category: self_hosted
homepage: https://docs.vllm.ai
interpreter: openai-compatible
variables:
  base_url:
    default: http://localhost:8000/v1
    description: OpenAI-compatible base URL of the server, including /v1.
    description_zh: "服务的 OpenAI 兼容地址，带 /v1。"
# Self-hosted servers often run without a key; an empty credential secret
# sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
endpoints:
  - id: responses
    protocol: openai-responses
    base_url: "{base_url}"
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - id: chat
    protocol: openai-chat
    capabilities:
      freeform_tools: false
    base_url: "{base_url}"
  # vLLM rejects suffix.
  - id: completions
    protocol: openai-completions
    base_url: "{base_url}"
  # Pooling models serve /embeddings; Whisper-style models serve
  # /audio/transcriptions and /audio/translations, not speech
  # (https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html).
  - id: embeddings
    protocol: openai-embeddings
    base_url: "{base_url}"
  - id: audio
    protocol: openai-audio
    base_url: "{base_url}"
    capabilities:
      speech: false
  # Reranker (cross-encoder) models; /v1/rerank returns results with
  # document.text.
  - protocol: rerank
    base_url: "{base_url}"
models:
  list: /models
