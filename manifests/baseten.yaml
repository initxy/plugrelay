# Checked 2026-11 against the vendor's docs:
#   https://docs.baseten.co/inference/model-apis/overview
#   https://docs.baseten.co/inference/model-apis/pricing-and-limits
#   https://docs.baseten.co/reference/inference-api/chat-completions
id: baseten
kind: provider
name: Baseten Model APIs
name_zh: "Baseten 模型 API"
category: inference
homepage: https://docs.baseten.co
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://inference.baseten.co/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      max_tokens_field: max_tokens
      reasoning: reasoning_content
  # Stateless: the full history goes in input.
  - id: responses
    protocol: openai-responses
    base_url: https://inference.baseten.co/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  # Beta.
  - protocol: anthropic
    base_url: https://inference.baseten.co
    interpreter: anthropic-compatible
    capabilities:
      cache: implicit
      cache_1h: false
      server_tools: []
      deferred_tools: false
models:
  list: /models
