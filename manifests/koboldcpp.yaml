# Checked 2026-11 against the vendor's docs:
#   https://github.com/LostRuins/koboldcpp/blob/concedo/README.md
#   https://github.com/LostRuins/koboldcpp/blob/concedo/koboldcpp.py
# Each media route needs the matching model loaded (image, Whisper, TTS).
id: koboldcpp
kind: provider
name: KoboldCpp
category: self_hosted
homepage: https://github.com/LostRuins/koboldcpp
interpreter: openai-compatible
variables:
  server_url:
    default: http://localhost:5001
    description: Root URL of the server, without /v1.
    description_zh: "服务的根地址，不带 /v1。"
# Runs without a key unless started with --password (Authorization:
# Bearer only; image routes are not protected); an empty credential
# secret sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
  max_tokens_field: max_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
  - id: responses
    protocol: openai-responses
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - id: completions
    protocol: openai-completions
    base_url: "{server_url}/v1"
  - protocol: anthropic
    base_url: "{server_url}"
    interpreter: anthropic-compatible
    capabilities:
      cache: implicit
      cache_1h: false
      server_tools: []
      deferred_tools: false
  - id: embeddings
    protocol: openai-embeddings
    base_url: "{server_url}/v1"
  - id: images
    protocol: openai-images
    base_url: "{server_url}/v1"
  # Transcriptions and speech; no translations.
  - id: audio
    protocol: openai-audio
    base_url: "{server_url}/v1"
models:
  list: /models
