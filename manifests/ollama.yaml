# Checked 2026-11 against the vendor's docs:
#   https://docs.ollama.com/api/openai-compatibility
#   https://github.com/ollama/ollama/blob/main/docs/api/openai-compatibility.mdx
id: ollama
kind: provider
name: Ollama
category: self_hosted
homepage: https://docs.ollama.com
interpreter: openai-compatible
variables:
  base_url:
    default: http://localhost:11434/v1
    description: OpenAI-compatible base URL of the server, including /v1.
    description_zh: "服务的 OpenAI 兼容地址，带 /v1。"
# Self-hosted servers often run without a key; an empty credential secret
# sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
endpoints:
  - id: responses
    protocol: openai-responses
    base_url: "{base_url}"
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - id: chat
    protocol: openai-chat
    capabilities:
      freeform_tools: false
    base_url: "{base_url}"
  # Ollama accepts suffix for models with a fill-in-the-middle template.
  - id: completions
    protocol: openai-completions
    capabilities:
      fill_in_middle: true
    base_url: "{base_url}"
  - id: embeddings
    protocol: openai-embeddings
    base_url: "{base_url}"
  # Transcriptions, translations and speech (wav by default). There is no
  # /v1/images route.
  - id: audio
    protocol: openai-audio
    base_url: "{base_url}"
models:
  list: /models
