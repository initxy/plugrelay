# Checked 2026-11 against the vendor's docs:
#   https://docs.sglang.io/basic_usage/openai_api_completions.html
#   https://docs.sglang.io/advanced_features/server_arguments.html
#   https://docs.sglang.io/docs/basic_usage/anthropic_api
# Prefix reuse is RadixAttention. Reasoning text is split out only when the
# server runs with --reasoning-parser.
id: sglang
kind: provider
name: SGLang
category: self_hosted
homepage: https://docs.sglang.io
interpreter: openai-compatible
variables:
  server_url:
    default: http://localhost:30000
    description: Root URL of the SGLang server, without /v1.
    description_zh: "SGLang 服务的根地址，不带 /v1。"
# Runs without a key unless started with --api-key; an empty credential
# secret sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
  - id: completions
    protocol: openai-completions
    base_url: "{server_url}/v1"
  - protocol: anthropic
    base_url: "{server_url}"
    interpreter: anthropic-compatible
    capabilities:
      cache: implicit
      cache_1h: false
      server_tools: []
      deferred_tools: false
models:
  list: /models
