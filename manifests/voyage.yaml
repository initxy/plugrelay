# Checked 2026-11 against the vendor's docs:
#   https://docs.voyageai.com/reference/embeddings-api
#   https://docs.voyageai.com/docs/batch-inference
# Embeddings only. The request names output size output_dimension, not
# dimensions, and takes input_type (query or document).
id: voyage
kind: provider
name: Voyage AI
category: vendor
homepage: https://docs.voyageai.com
interpreter: openai-compatible
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
endpoints:
  - id: embeddings
    protocol: openai-embeddings
    base_url: https://api.voyageai.com/v1
