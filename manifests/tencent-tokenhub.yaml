# Checked 2026-11 against the vendor's docs:
#   https://cloud.tencent.com/document/product/1823/130058
#   https://cloud.tencent.com/document/product/1823/132248
# TokenHub succeeds Tencent Hunyuan's API and LKEAP (DeepSeek on Tencent
# Cloud), which take no new purchases. Responses serves only some models.
id: tencent-tokenhub
kind: provider
name: Tencent Cloud TokenHub
name_zh: "腾讯云 TokenHub"
category: cloud
homepage: https://cloud.tencent.com/document/product/1823
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
  max_tokens_field: max_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://tokenhub.tencentmaas.com/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
  - id: responses
    protocol: openai-responses
    base_url: https://tokenhub.tencentmaas.com/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - protocol: anthropic
    base_url: https://tokenhub.tencentmaas.com
    interpreter: anthropic-compatible
    auth:
      header: x-api-key
      scheme: raw
    capabilities:
      cache_1h: false
      server_tools: []
      deferred_tools: false
