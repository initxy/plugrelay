# Checked 2026-11 against the vendor's docs:
#   https://lmstudio.ai/docs/developer/openai-compat
#   https://lmstudio.ai/docs/developer/openai-compat/chat-completions
id: lmstudio
kind: provider
name: LM Studio
category: self_hosted
homepage: https://lmstudio.ai/docs
interpreter: openai-compatible
variables:
  base_url:
    default: http://localhost:1234/v1
    description: OpenAI-compatible base URL of the server, including /v1.
    description_zh: "服务的 OpenAI 兼容地址，带 /v1。"
# Self-hosted servers often run without a key; an empty credential secret
# sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
endpoints:
  - id: responses
    protocol: openai-responses
    base_url: "{base_url}"
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - id: chat
    protocol: openai-chat
    capabilities:
      freeform_tools: false
    base_url: "{base_url}"
  - id: completions
    protocol: openai-completions
    base_url: "{base_url}"
  - id: embeddings
    protocol: openai-embeddings
    base_url: "{base_url}"
models:
  list: /models
