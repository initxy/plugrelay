# Checked 2026-11 against the vendor's docs:
#   https://docs.api.nvidia.com/nim/reference/llm-apis
#   https://docs.api.nvidia.com/nim/reference/create_chat_completion_v1_chat_completions_post
#   https://docs.api.nvidia.com/nim/reference/nvidia-nv-embedqa-e5-v5-infer
id: nvidia-nim
kind: provider
name: NVIDIA NIM (API catalog)
name_zh: "NVIDIA NIM（API 目录）"
category: inference
homepage: https://build.nvidia.com
interpreter: openai-compatible
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
  max_tokens_field: max_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://integrate.api.nvidia.com/v1
    capabilities:
      freeform_tools: false
      reasoning: reasoning_content
  # Retriever models need the extra input_type (query or passage).
  - id: embeddings
    protocol: openai-embeddings
    base_url: https://integrate.api.nvidia.com/v1
