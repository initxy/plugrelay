# Checked 2026-11 against the vendor's docs:
#   https://docs.mozilla.ai/llamafile/using-llamafile/api.md
#   https://docs.mozilla.ai/llamafile/using-llamafile/running_llamafile.md
#   https://github.com/mozilla-ai/llamafile
#   https://raw.githubusercontent.com/ggml-org/llama.cpp/master/tools/server/README.md
# Run with --server. Built on llama.cpp's server; /v1/completions does not
# document suffix.
id: llamafile
kind: provider
name: llamafile
category: self_hosted
homepage: https://github.com/mozilla-ai/llamafile
interpreter: openai-compatible
variables:
  server_url:
    default: http://localhost:8080
    description: Root URL of the server, without /v1.
    description_zh: "服务的根地址，不带 /v1。"
# Runs without a key unless started with --api-key (Authorization: Bearer
# or X-Api-Key); an empty credential secret sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: implicit
  max_tokens_field: max_tokens
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
  - id: responses
    protocol: openai-responses
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - id: completions
    protocol: openai-completions
    base_url: "{server_url}/v1"
  - protocol: anthropic
    base_url: "{server_url}"
    interpreter: anthropic-compatible
    capabilities:
      cache: implicit
      cache_1h: false
      server_tools: []
      deferred_tools: false
  - id: embeddings
    protocol: openai-embeddings
    base_url: "{server_url}/v1"
  # Transcriptions only.
  - id: audio
    protocol: openai-audio
    base_url: "{server_url}/v1"
    capabilities:
      speech: false
  # Needs --reranking and a reranker model; fields follow llama.cpp's
  # server (no return_documents, no documents in the results).
  - protocol: rerank
    base_url: "{server_url}/v1"
models:
  list: /models
