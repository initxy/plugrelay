# Checked 2026-11 against the vendor's docs:
#   https://longcat.chat/platform/docs/
#   https://longcat.chat/platform/docs/zh/api/model-params
# temperature is fixed per thinking mode; other values are overwritten.
id: longcat
kind: provider
name: Meituan LongCat
name_zh: "美团 LongCat"
category: vendor
homepage: https://longcat.chat/platform/docs/
auth:
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: https://api.longcat.chat/openai/v1
    interpreter: openai-compatible
    capabilities:
      freeform_tools: false
      max_tokens_field: max_tokens
  - protocol: anthropic
    base_url: https://api.longcat.chat/anthropic
    interpreter: anthropic-compatible
    capabilities:
      cache_1h: false
      server_tools: []
      deferred_tools: false
