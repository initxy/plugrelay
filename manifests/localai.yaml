# Checked 2026-11 against the vendor's docs:
#   https://localai.io/docs/features/text-generation/
#   https://localai.io/docs/features/authentication/
id: localai
kind: provider
name: LocalAI
category: self_hosted
homepage: https://localai.io/docs
interpreter: openai-compatible
variables:
  server_url:
    default: http://localhost:8080
    description: Root URL of the LocalAI server, without /v1.
    description_zh: "LocalAI 服务的根地址，不带 /v1。"
# Runs without a key unless API keys are configured; an empty credential
# secret sends no Authorization header.
auth:
  key_optional: true
  header: Authorization
  scheme: Bearer
capabilities:
  cache: none
endpoints:
  - id: chat
    protocol: openai-chat
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
  - id: responses
    protocol: openai-responses
    base_url: "{server_url}/v1"
    capabilities:
      freeform_tools: false
      server_tools: []
      deferred_tools: false
      server_state: false
      compaction: false
  - id: completions
    protocol: openai-completions
    base_url: "{server_url}/v1"
  - protocol: anthropic
    base_url: "{server_url}"
    interpreter: anthropic-compatible
    capabilities:
      cache_1h: false
      server_tools: []
      deferred_tools: false
models:
  list: /models
