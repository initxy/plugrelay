name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout leaves the tag lightweight; fetch it again to get its message.
      - run: git fetch --force --tags
      - name: Require a changelog in the tag message
        run: |
          body=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::$GITHUB_REF_NAME has no changelog: push an annotated tag whose message has a body (docs/releasing.md)"
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd web && npm ci && npm run build
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
