name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: plugrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: plugrelay
          MYSQL_DATABASE: plugrelay
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pplugrelay" --health-interval 5s --health-retries 20
    env:
      PLUGRELAY_TEST_PG: postgres://postgres:plugrelay@127.0.0.1:5432/postgres?sslmode=disable
      PLUGRELAY_TEST_MYSQL: root:plugrelay@tcp(127.0.0.1:3306)/plugrelay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: cd web && npm ci
      - run: scripts/check.sh
