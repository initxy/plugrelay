name: Feature request
description: Suggest something plugrelay should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What you are trying to do and what gets in the way.}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposal, description: What plugrelay could do about it.}
    validations: {required: true}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives, description: Workarounds or other approaches you considered.}
